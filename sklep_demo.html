<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlavorBox — sklep demo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0b0f;color:#fff}
header{padding:22px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #25252d;position:sticky;top:0;background:#0b0b0fee;backdrop-filter:blur(10px);z-index:5}
.logo{font-size:25px;font-weight:800}.logo span{color:#7c5cff}
.cart-btn,.buy{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer}
.cart-btn{background:#fff;color:#111}.hero{padding:70px 6% 40px;text-align:center}
.hero h1{font-size:48px;margin:0 0 12px}.hero p{color:#aaa;font-size:18px}
.grid{max-width:1100px;margin:35px auto 80px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:#15151c;border:1px solid #282833;border-radius:20px;padding:20px;box-shadow:0 10px 30px #0004}
.product-img{height:180px;border-radius:15px;display:grid;place-items:center;font-size:60px;background:linear-gradient(135deg,#22223a,#171720)}
.card h3{margin:18px 0 7px}.desc{color:#999;min-height:42px}.price{font-size:22px;font-weight:800;margin:15px 0}
.buy{width:100%;background:#7c5cff;color:white}.buy:hover{background:#6847ef}
.drawer{position:fixed;right:-420px;top:0;width:min(420px,100%);height:100%;background:#111117;z-index:10;padding:25px;transition:.25s;box-shadow:-10px 0 40px #0008}
.drawer.open{right:0}.close{float:right;background:none;color:#fff;border:0;font-size:25px;cursor:pointer}
.item{display:flex;gap:12px;align-items:center;border-bottom:1px solid #292932;padding:15px 0}.item .grow{flex:1}
.qty button{background:#292933;color:white;border:0;border-radius:7px;padding:5px 9px;cursor:pointer}
.total{font-size:24px;font-weight:800;margin:25px 0}
.form input{width:100%;padding:12px;margin:7px 0;background:#1c1c24;border:1px solid #33333e;border-radius:9px;color:white}
.order{width:100%;padding:14px;border:0;border-radius:10px;background:#35c46a;color:white;font-weight:800;cursor:pointer}
.note{font-size:12px;color:#777;margin-top:12px;line-height:1.4}
</style>
</head>
<body>
<header>
  <div class="logo">Flavor<span>Box</span></div>
  <button class="cart-btn" onclick="openCart()">🛒 Koszyk (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <h1>Smak, który wybierasz.</h1>
  <p>Sklep demonstracyjny — przykładowe produkty smakowe bez funkcji wdychania.</p>
</section>

<main class="grid" id="products"></main>

<aside class="drawer" id="drawer">
  <button class="close" onclick="closeCart()">×</button>
  <h2>Twój koszyk</h2>
  <div id="cart"></div>
  <div class="total">Razem: <span id="total">0,00 zł</span></div>
  <div class="form">
    <input id="name" placeholder="Imię">
    <input id="email" type="email" placeholder="E-mail">
  </div>
  <button class="order" onclick="demoOrder()">ZŁÓŻ ZAMÓWIENIE DEMO</button>
  <div class="note">To jest demonstracja. Przycisk nie pobiera pieniędzy i nie wysyła prawdziwego zamówienia.</div>
</aside>

<script>
const products=[
 {id:1,name:"Mint Blast",price:7.99,emoji:"🍃",desc:"Klasyczny miętowy smak."},
 {id:2,name:"Blue Berry",price:8.99,emoji:"🫐",desc:"Słodki, owocowy wariant."},
 {id:3,name:"Strawberry",price:8.49,emoji:"🍓",desc:"Truskawkowy smak."},
 {id:4,name:"Tropical Mix",price:9.49,emoji:"🥭",desc:"Mango + egzotyczne owoce."},
 {id:5,name:"CUSTOM",price:10.99,emoji:"✨",desc:"Wpisz własny smak."}
];
let cart={};

function renderProducts(){
 document.getElementById("products").innerHTML=products.map(p=>`
 <article class="card">
   <div class="product-img">${p.emoji}</div>
   <h3>${p.name}</h3><div class="desc">${p.desc}</div>
   <div class="price">${p.price.toFixed(2).replace(".",",")} zł</div>
   <button class="buy" onclick="add(${p.id})">Dodaj do koszyka</button>
 </article>`).join("");
}
function add(id){
 if(id===5){let flavor=prompt("Jaki smak chcesz? (np. arbuz, cola, mango)"); if(!flavor||!flavor.trim())return; let key="custom:"+flavor.trim(); cart[key]=(cart[key]||0)+1; renderCart(); openCart(); return;}
 cart[id]=(cart[id]||0)+1;renderCart();openCart()
}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderCart()}
function renderCart(){
 let entries=Object.entries(cart);
 document.getElementById("count").textContent=entries.reduce((a,[,q])=>a+q,0);
 if(!entries.length){document.getElementById("cart").innerHTML='<p style="color:#888">Koszyk jest pusty.</p>';document.getElementById("total").textContent="0,00 zł";return}
 let total=0;
 document.getElementById("cart").innerHTML=entries.map(([id,q])=>{
  let p=products.find(x=>x.id==id); if(typeof id === "string" && id.startsWith("custom:")){p={name:"CUSTOM — "+id.slice(7),price:10.99,emoji:"✨"};} total+=p.price*q;
  return `<div class="item"><div style="font-size:28px">${p.emoji}</div><div class="grow"><b>${p.name}</b><br><small>${p.price.toFixed(2)} zł/szt.</small></div><div class="qty"><button onclick="change(${p.id},-1)">−</button> ${q} <button onclick="change(${p.id},1)">+</button></div></div>`;
 }).join("");
 document.getElementById("total").textContent=total.toFixed(2).replace(".",",")+" zł";
}
function openCart(){document.getElementById("drawer").classList.add("open")}
function closeCart(){document.getElementById("drawer").classList.remove("open")}
function demoOrder(){
 if(!Object.keys(cart).length)return alert("Koszyk jest pusty.");
 let name=document.getElementById("name").value.trim(),email=document.getElementById("email").value.trim();
 if(!name||!email)return alert("Wpisz imię i e-mail.");
 alert("Demo: zamówienie zostało przygotowane. Nie wysłano żadnej płatności ani prawdziwego zamówienia.");
}
renderProducts();renderCart();
</script>
</body>
</html>
